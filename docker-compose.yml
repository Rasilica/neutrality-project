services:
  # 1. PostgreSQL 데이터베이스 서버
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d  # 최초 실행 시 스키마 자동 초기화
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 2. AI 분석 엔진 (Python FastAPI)
  ai-engine:
    build:
      context: ./ai-engine
    ports:
      - "127.0.0.1:${AI_ENGINE_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_ENGINE_ADMIN_TOKEN: ${AI_ENGINE_ADMIN_TOKEN:?AI_ENGINE_ADMIN_TOKEN must be set}
      AI_ENGINE_ADMIN_CIDRS: 127.0.0.1/32,172.16.0.0/12,10.0.0.0/8
      CRAWLER_ALLOWED_HOSTS: ${CRAWLER_ALLOWED_HOSTS:-}
      ANALYSIS_SOURCE_HOSTS: ${ANALYSIS_SOURCE_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ai-engine:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  ai-worker:
    build:
      context: ./ai-engine
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CRAWLER_ALLOWED_HOSTS: ${CRAWLER_ALLOWED_HOSTS:-}
      ANALYSIS_SOURCE_HOSTS: ${ANALYSIS_SOURCE_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ai-engine:/app
    restart: unless-stopped
    command: python worker.py

  # 3. 비즈니스 API 서버 (Java Spring Boot)
  api-server:
    build:
      context: ./api-server
    ports:
      - "127.0.0.1:${API_SERVER_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      ANALYSIS_SOURCE_HOSTS: ${ANALYSIS_SOURCE_HOSTS:-news.sbs.co.kr}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
